<!DOCTYPE html>
<html lang="en">
   <head>
      <title>SBD's Birds</title>
      <meta http-equiv="content-type" content="text/html; charset=utf-8" />
      <meta name="author" content="Nebez Briefkani" />
      <meta name="description" content="play SBD's Birds. a remake of popular game flappy bird built in html/css/js" />
      <meta name="keywords" content="flappybird,flappy,bird,floppybird,floppy,html,html5,css,css3,js,javascript,jquery,github,nebez,briefkani,nebezb,open,source,opensource" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

      <!-- Open Graph tags -->
      <meta property="og:title" content="SBD's Birds" />
      <meta property="og:description" content="play SBD's Birds. a remake of popular game flappy bird built in html/css/js" />
      <meta property="og:type" content="website" />
      <meta property="og:image" content="https://nebezb.com/floppybird/assets/thumb.png" />
      <meta property="og:url" content="https://nebezb.com/floppybird/" />
      <meta property="og:site_name" content="Floppy Bird" />

      <!-- Style sheets -->
      <link href="css/reset.css" rel="stylesheet">
      <link href="css/main.css" rel="stylesheet">
   <style>
         #hanging_logo {
            position: absolute;
            top: 20px; /* Cách mép trên 20px */
            left: 50%;
            transform: translateX(-50%);
            width: 230px;
            padding: 12px;
            background-color: #e89543; 
            border: 4px solid #533847;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 0 #bf7230;
            z-index: 999; /* Nổi lên trên cùng */
            animation: sway 3s infinite ease-in-out;
            transform-origin: top center;
         }
   
         /* Dây treo */
         #hanging_logo::before, #hanging_logo::after {
            content: '';
            position: absolute;
            top: -25px; /* Độ dài dây */
            width: 6px;
            height: 25px;
            background-color: #533847;
         }
         #hanging_logo::before { left: 45px; }
         #hanging_logo::after { right: 45px; }
   
         /* Chữ */
           .logo_text {
       font-family: 'Courier New', Courier, monospace;
       
       /* 1. Làm chữ dày nhất có thể */
       font-weight: 900; 
       font-size: 28px;
       color: #ffffff; /* Màu chữ trắng */
       
      /* Viền đen dày dặn */
          text-shadow: 
              2.5px 0 0 #000, -2.5px 0 0 #000, 0 2.5px 0 #000, 0 -2.5px 0 #000,
              1.5px 1.5px 0 #000, -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000;
          
          letter-spacing: -1px;
          text-transform: uppercase;
          display: block;
      }
            
         /* Hiệu ứng đong đưa */
         @keyframes sway {
            0%, 100% { transform: translateX(-50%) rotate(3deg); }
            50% { transform: translateX(-50%) rotate(-3deg); }
         }
      </style>
      <script defer src="https://yummy.nebez.dev/script.js" data-website-id="9ceaba15-371f-4407-a59a-f57a7214af41"></script>
   </head>
   <body>
      <div id="gamecontainer">
         <div id="gamescreen">
            <div id="hanging_logo">
                <span class="logo_text">SBD'S BIRDS</span>
            </div>
            
            <div id="sky" class="animated">
               <div id="flyarea">
                  <div id="ceiling" class="animated"></div>
                  <!-- This is the flying and pipe area container -->
                  <div id="player" class="bird animated"></div>

                  <div id="bigscore"></div>

                  <div id="splash"></div>

                  <div id="scoreboard">
                     <div id="medal"></div>
                     <div id="currentscore"></div>
                     <div id="highscore"></div>
                     <div id="replay"><img src="assets/replay.png" alt="replay"></div>
                  </div>

                  <!-- Pipes go here! -->
               </div>
            </div>
            <div id="land" class="animated"><div id="debug"></div></div>
         </div>
      </div>
      <div id="footer">
         <a href="https://www.dotgears.com/">original game/concept/art by dong nguyen</a>
         <a href="https://nebezb.com/">recreated by ae SBD</a>
         <a href="https://github.com/nebez/floppybird/">view github project</a>
      </div>
      <div class="boundingbox" id="playerbox"></div>
      <div class="boundingbox" id="pipebox"></div>

      <script src="js/jquery.min.js"></script>
      <script src="js/jquery.transit.min.js"></script>
      <script src="js/buzz.min.js"></script>
      <script src="js/main.js"></script>
   </body>
</html>
